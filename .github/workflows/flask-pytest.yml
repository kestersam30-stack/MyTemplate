name: MyTemplate Build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: [3.12, 3.13]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest-cov
          python -m playwright install --with-deps chromium

      - name: Ruff
        run: |
          mkdir -p reports
          ruff check . --exclude env --exclude venv --output-format json > reports/ruff.json || true

      - name: Bandit
        run: |
          mkdir -p reports
          bandit -r appname -f json -o reports/bandit.json || true

      - name: Start Flask Server
        run: |
          APPNAME_ENV=test python manage.py runserver --host 127.0.0.1 --port 5000 > flask.log 2>&1 &

          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/login > /dev/null; then
              echo "Flask server is ready"
              break
            fi
            echo "Waiting for Flask server..."
            sleep 2
          done

          if ! curl -s http://127.0.0.1:5000/login > /dev/null; then
            echo "Flask server failed to start"
            cat flask.log
            exit 1
          fi

      - name: Run Tests and Coverage
        run: |
          mkdir -p reports
          pytest -q tests/ \
            --junitxml=reports/junit.xml \
            --cov=appname \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-python-${{ matrix.python-version }}
          path: reports/