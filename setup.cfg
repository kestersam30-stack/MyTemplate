[pep8]
max-line-length = 120
ignore = E302,E123,E133,E226,E241,E242
exclude = tests/*,.git,env,migrations/*

[flake8]
ignore = E302,E123,E133,E226,E241,E242,E305,E402,E501,E741,F401,F523,F811,W291,W292,W391
max-line-length = 120
exclude = tests/*,.git,env,migrations/*
max-complexity = 10
import-order-style = pep8